name: Individual AI tool or license request
description: Request access to an approved AI tool or feature for individual use.
title: "[Access] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for individual access to an approved tool or feature. Departmental solutions will be routed to the AI use-case process.
  - type: input
    id: department
    attributes:
      label: Department
    validations:
      required: true
  - type: input
    id: requester_role
    attributes:
      label: Requester role
      description: Use a role or approved identifier; avoid unnecessary personal details.
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Requested tool or feature
    validations:
      required: true
  - type: textarea
    id: justification
    attributes:
      label: Business justification and expected frequency of use
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Requested environment
      options: ["Sandbox", "Production", "Unsure"]
    validations:
      required: true
  - type: textarea
    id: data_access
    attributes:
      label: Data and system access involved
      description: Describe categories and systems; do not include actual data or credentials.
    validations:
      required: true
  - type: input
    id: cost_approval
    attributes:
      label: Department cost-approval reference
      description: Provide the controlled reference or state that approval is pending.
    validations:
      required: true
  - type: checkboxes
    id: training
    attributes:
      label: Training acknowledgement
      options:
        - label: I will complete required acceptable-use and tool-specific training before access is granted.
          required: true
