name: AI risk or monitoring issue
description: Record a risk signal, operational issue, or monitoring exception for an existing use case.
title: "[AI Issue] AI-#### — "
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose vulnerabilities, credentials, personal information, or restricted incident evidence in this form. Use the approved private escalation route when needed.
  - type: input
    id: ai_id
    attributes:
      label: AI use-case ID
      placeholder: AI-0001
    validations:
      required: true
  - type: dropdown
    id: signal
    attributes:
      label: Signal or issue category
      options:
        - User feedback
        - Output quality or reliability
        - Data access
        - Data consumption
        - Cost or license consumption
        - Performance
        - Model or provider change
        - Privacy
        - Fairness or equity
        - Security or resilience
        - Compliance or policy
        - Other
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Preliminary severity
      options: ["Low", "Medium", "High", "Critical"]
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Sanitized description
      description: Describe what was observed, scope, timing, and potential impact.
    validations:
      required: true
  - type: textarea
    id: containment
    attributes:
      label: Immediate containment or response
    validations:
      required: true
  - type: dropdown
    id: escalation
    attributes:
      label: Is governance escalation requested?
      options: ["Yes", "No", "Unsure"]
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Controlled evidence reference
      description: Provide a safe reference, not the sensitive evidence itself.
